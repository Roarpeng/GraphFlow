name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  package-windows:
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    # windows-latest now ships VS 2026 (v18); npm 10's node-gyp cannot detect it.
    # Pin to windows-2022 (VS 2022 / v17) until node-gyp >=12.1 is bundled in our Node line.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json

      - name: Enable package manager
        run: corepack enable

      - name: Install root dependencies
        run: npm ci --no-audit
        env:
          GRAPHFLOW_SKIP_POSTINSTALL: "1"

      - name: Install extension dependencies
        run: npm ci --prefix vscode-extension

      - name: Build and smoke-test extension
        run: npm run build && npm run build:extension && npm run test:extension

      - name: Package VSIX
        run: npm run package:extension

      - name: Prune old VSIX artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Keep only the 2 newest graphflow-extension artifacts to avoid quota exhaustion (~150MB each).
          mapfile -t OLD_IDS < <(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts | map(select(.name=="graphflow-extension")) | sort_by(.created_at) | reverse | .[2:] | .[].id')
          for id in "${OLD_IDS[@]}"; do
            echo "Deleting artifact id=$id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${id}" || true
          done

      - name: Publish VSIX to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./vscode-extension/package.json').version")
          TAG="v${VERSION}"
          VSIX=$(ls artifacts/graphflow-*.vsix | head -n 1)
          NOTES="GraphFlow VS Code/Cursor extension **v${VERSION}**.

          ## Highlights
          - Workbench navigation: \`graphflow_plan\` seeds function-topic containers; collapsed outline; click topicId to resume; drift forks a side branch
          - \`graphflow_context\` \`topicId\` / \`assistantReply\` two-beat capture (original Q/A, not LLM abstracts)
          - DeepSeek Harness (dsh) plugin: \`dsh plugin --profile web add @roarpeng/graphflow\`
          - Settings is a single page (graph, Office/PDF, embeddings, MCP, models)
          - VSIX does **not** bundle @xenova/transformers

          ## Install
          Download \`graphflow-${VERSION}.vsix\` → **Extensions → Install from VSIX** → reload.
          After a complex \`graphflow_plan\`, open **GraphFlow: Workbench Tree** (collapsed by default) or chat \`/tree\`.

          Built on Windows from commit ${GITHUB_SHA::7}."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$VSIX" --title "GraphFlow VS Code Extension v${VERSION}" --notes "$NOTES" --latest
          fi

      - name: Upload VSIX artifact
        id: upload-vsix
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: graphflow-extension
          path: artifacts/graphflow-*.vsix
          retention-days: 7
          overwrite: true

      - name: Artifact upload warning
        if: failure() && steps.upload-vsix.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::VSIX artifact upload failed (often due to Actions storage quota). VSIX was still published to GitHub Releases if the release step succeeded."

  publish-openvsx:
    needs: package-windows
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Open VSX credentials
        id: ovsx
        env:
          OPEN_VSX_TOKEN: ${{ secrets.open_vsx_token }}
        run: |
          if [ -n "${OPEN_VSX_TOKEN}" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
            echo "Open VSX auth: open_vsx_token configured"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "Open VSX auth: none"
          fi

      - name: Skip Open VSX publish without token
        if: steps.ovsx.outputs.mode == 'none'
        run: |
          echo "::warning::Skipping Open VSX publish: repository secret open_vsx_token is not configured."

      - name: Setup Node.js
        if: steps.ovsx.outputs.mode == 'pat'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json

      - name: Enable package manager
        if: steps.ovsx.outputs.mode == 'pat'
        run: corepack enable

      - name: Install root dependencies
        if: steps.ovsx.outputs.mode == 'pat'
        run: npm ci --no-audit
        env:
          GRAPHFLOW_SKIP_POSTINSTALL: "1"

      - name: Install extension dependencies
        if: steps.ovsx.outputs.mode == 'pat'
        run: npm ci --prefix vscode-extension

      - name: Publish GraphFlow Tool to Open VSX
        if: steps.ovsx.outputs.mode == 'pat'
        env:
          OPEN_VSX_TOKEN: ${{ secrets.open_vsx_token }}
          OVSX_NAMESPACE: roarpeng
        run: node scripts/publish-openvsx-idempotent.mjs
