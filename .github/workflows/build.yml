name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  package-windows:
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    # windows-latest now ships VS 2026 (v18); npm 10's node-gyp cannot detect it.
    # Pin to windows-2022 (VS 2022 / v17) until node-gyp >=12.1 is bundled in our Node line.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json

      - name: Enable package manager
        run: corepack enable

      - name: Install root dependencies
        run: npm ci --no-audit
        env:
          GRAPHFLOW_SKIP_POSTINSTALL: "1"

      - name: Install extension dependencies
        run: npm ci --prefix vscode-extension

      - name: Build and smoke-test extension
        run: npm run build && npm run build:extension && npm run test:extension

      - name: Package VSIX
        run: npm run package:extension

      - name: Prune old VSIX artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Keep only the 2 newest graphflow-tool-extension artifacts to avoid quota exhaustion (~150MB each).
          mapfile -t OLD_IDS < <(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts | map(select(.name=="graphflow-tool-extension")) | sort_by(.created_at) | reverse | .[2:] | .[].id')
          for id in "${OLD_IDS[@]}"; do
            echo "Deleting artifact id=$id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${id}" || true
          done

      - name: Publish VSIX to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./vscode-extension/package.json').version")
          TAG="v${VERSION}"
          VSIX=$(ls artifacts/graphflow-tool-*.vsix | head -n 1)
          NOTES="GraphFlow VS Code/Cursor extension **v${VERSION}**.

          ## Highlights
          - Painless Trae/Windows MCP: auto-repair spaced Program Files commands on extension activate
          - Trae/Windows: MCP install writes space-free node paths (fixes 'C:\\Program' is not recognized)
          - Resilient embedding: hash fallback when Xenova is unavailable
          - Retrieval denoise + optional full-graph vector recall
          - Offline MiniLM cache via GRAPHFLOW_EMBEDDING_CACHE_DIR
          - VSIX does **not** bundle @xenova/transformers

          ## Install
          Download \`graphflow-tool-${VERSION}.vsix\` → **Extensions → Install from VSIX** → reload.
          MCP path repair runs automatically on activate (no manual Install required for the Program Files fix).

          Built on Windows from commit ${GITHUB_SHA::7}."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$VSIX" --title "GraphFlow VS Code Extension v${VERSION}" --notes "$NOTES" --latest
          fi

      - name: Upload VSIX artifact
        id: upload-vsix
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: graphflow-tool-extension
          path: artifacts/graphflow-tool-*.vsix
          retention-days: 7
          overwrite: true

      - name: Artifact upload warning
        if: failure() && steps.upload-vsix.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::VSIX artifact upload failed (often due to Actions storage quota). VSIX was still published to GitHub Releases if the release step succeeded."
