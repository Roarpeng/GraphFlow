name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Windows VSIX matches Cursor desktop users and avoids Linux-native vendor binaries.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json

      - name: Enable package manager
        run: corepack enable

      - name: Install root dependencies
        run: npm install --no-audit
        env:
          GRAPHFLOW_SKIP_POSTINSTALL: "1"

      - name: Install extension dependencies
        run: npm ci --prefix vscode-extension

      - name: Rebuild better-sqlite3
        run: npm rebuild better-sqlite3

      - name: Lint, build, test, and package extension
        run: npm run lint && npm run build && npm test && npm run build:extension && npm run test:extension

      - name: Package VSIX
        run: npm run package:extension

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: graphflow-vscode-extension
          path: artifacts/graphflow-vscode-*.vsix
          retention-days: 90

      - name: Publish VSIX to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./vscode-extension/package.json').version")
          TAG="v${VERSION}"
          VSIX=$(ls artifacts/graphflow-vscode-*.vsix | head -n 1)
          NOTES="GraphFlow VS Code/Cursor extension **v${VERSION}**.

          Install: download \`graphflow-vscode-${VERSION}.vsix\` and use **Extensions → Install from VSIX**.

          Built from commit ${GITHUB_SHA::7} on main."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$VSIX" --title "GraphFlow VS Code Extension v${VERSION}" --notes "$NOTES" --latest
          fi
