name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  package-windows:
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json

      - name: Enable package manager
        run: corepack enable

      - name: Install root dependencies
        run: npm ci --no-audit
        env:
          GRAPHFLOW_SKIP_POSTINSTALL: "1"

      - name: Install extension dependencies
        run: npm ci --prefix vscode-extension

      - name: Build and smoke-test extension
        run: npm run build && npm run build:extension && npm run test:extension

      - name: Package VSIX
        run: npm run package:extension

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: graphflow-vscode-extension
          path: artifacts/graphflow-vscode-*.vsix
          retention-days: 90

      - name: Publish VSIX to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./vscode-extension/package.json').version")
          TAG="v${VERSION}"
          VSIX=$(ls artifacts/graphflow-vscode-*.vsix | head -n 1)
          NOTES="GraphFlow VS Code/Cursor extension **v${VERSION}**.

          Install: download \`graphflow-vscode-${VERSION}.vsix\` and use **Extensions → Install from VSIX**.

          Built on Windows from commit ${GITHUB_SHA::7}."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$VSIX" --title "GraphFlow VS Code Extension v${VERSION}" --notes "$NOTES" --latest
          fi
