name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json

      - name: Enable package manager
        run: corepack enable

      - name: Install root dependencies
        run: npm ci

      - name: Install extension dependencies
        run: npm ci --prefix vscode-extension

      - name: Rebuild better-sqlite3
        run: npm rebuild better-sqlite3
        continue-on-error: ${{ matrix.os == 'windows-latest' }}

      - name: Lint, build, test, and package extension
        run: npm run lint && npm run build && npm test && npm run build:extension && npm run test:extension

      - name: Package VSIX
        if: matrix.os == 'ubuntu-latest'
        run: npm run package:extension

      - name: Upload VSIX artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: graphflow-vscode-extension
          path: artifacts/graphflow-vscode-*.vsix
          retention-days: 14
