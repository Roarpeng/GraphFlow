name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  skill-ab-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Enable package manager
        run: corepack enable

      - name: Install root dependencies
        run: npm ci --no-audit
        env:
          GRAPHFLOW_SKIP_POSTINSTALL: "1"

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3

      - name: Run skill A/B benchmark (if available)
        env:
          GRAPHFLOW_SKIP_EMBEDDING_WARMUP: "1"
        run: |
          if [ -f benchmarks/run-skill-ab.ts ]; then
            npx tsx benchmarks/run-skill-ab.ts
          else
            echo "::warning::benchmarks/run-skill-ab.ts not present yet — skipping skill A/B benchmark"
          fi

  comprehensive-benchmark:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Enable package manager
        run: corepack enable

      - name: Install root dependencies
        run: npm ci --no-audit
        env:
          GRAPHFLOW_SKIP_POSTINSTALL: "1"

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3

      - name: Run comprehensive benchmark
        env:
          GRAPHFLOW_SKIP_EMBEDDING_WARMUP: "1"
        run: npx tsx benchmarks/run-comprehensive-bench.ts

  swe-bench-eval:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Enable package manager
        run: corepack enable

      - name: Install root dependencies
        run: npm ci --no-audit
        env:
          GRAPHFLOW_SKIP_POSTINSTALL: "1"

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3

      - name: Run SWE-bench evaluation
        env:
          GRAPHFLOW_SKIP_EMBEDDING_WARMUP: "1"
        run: npx tsx benchmarks/run-swe-bench-eval.ts
