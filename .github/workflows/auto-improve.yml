name: Auto Improve

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  auto-improve:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json

      - name: Enable package manager
        run: corepack enable

      - name: Install root dependencies
        run: npm ci --no-audit
        env:
          GRAPHFLOW_SKIP_POSTINSTALL: "1"

      - name: Install extension dependencies
        run: npm ci --prefix vscode-extension

      - name: Rebuild better-sqlite3
        run: npm rebuild better-sqlite3

      - name: Build core
        run: npm run build

      - name: Run GraphFlow context analysis
        run: |
          node dist/surfaces/cli/index.js context preview "项目整体架构、代码质量、潜在改进点" --json > tmp/graphflow-context.json || true
        continue-on-error: true

      - name: Run GraphFlow graph inspect
        run: |
          node dist/surfaces/cli/index.js graph inspect --json > tmp/graphflow-inspect.json || true
        continue-on-error: true

      - name: Auto fix ESLint issues
        run: npm run lint -- --fix
        continue-on-error: true

      - name: Check for improvements
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No auto-improvements found."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Auto-improvements detected."
          fi

      - name: Commit and push improvements
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: auto-improve code quality [skip ci]"
          git push
