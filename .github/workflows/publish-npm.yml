name: Publish npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Enable package manager
        run: corepack enable

      - name: Install dependencies
        run: npm install --no-audit
        env:
          GRAPHFLOW_SKIP_POSTINSTALL: "1"
          HUSKY: "0"

      - name: Lint, build, and test
        run: npm run lint && npm run build && npm test

      - name: Evidence and fidelity release gates
        run: npm run gate:release

      - name: Publish @roarpeng/graphflow (idempotent)
        run: node scripts/publish-npm-idempotent.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token != '' && secrets.npm_token || secrets.NPM_TOKEN }}
          HUSKY: "0"
