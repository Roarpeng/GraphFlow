name: Publish npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Enable package manager
        run: corepack enable

      - name: Install dependencies
        run: npm install --no-audit
        env:
          GRAPHFLOW_SKIP_POSTINSTALL: "1"
          HUSKY: "0"

      - name: Lint, build, and test
        run: npm run lint && npm run build && npm test

      - name: Generate release evidence (flywheel self-proof)
        run: npx tsx scripts/ci-release-evidence.ts
        env:
          # Explicit observable signal instead of inferring it from the workflow
          # name: the previous step runs lint + build + test and a non-zero exit
          # aborts the job, so reaching this line IS the test result.
          GRAPHFLOW_CI_TEST_RESULT: pass

      - name: Evidence and fidelity release gates
        run: npm run gate:release
        env:
          GRAPHFLOW_CONFIG_PATH: graphflow-out/ci.config.json

      - name: Install an npm that supports OIDC trusted publishing
        # Deliberately AFTER install/lint/build/test so those keep using the
        # runner's known-good npm. A too-old npm cannot complete the OIDC token
        # exchange and fails confusingly as
        # "E404 ... PUT https://registry.npmjs.org/@scope%2fname".
        run: |
          npm install -g npm@latest
          npm --version

      - name: Verify OIDC trusted-publishing prerequisites
        # There is intentionally no NPM_TOKEN here. npm exchanges the GitHub OIDC
        # token for a short-lived publish credential, so no long-lived secret can
        # expire and break a release (the previous token expired 2026-09-09).
        # Auth is configured on npmjs.com: package Settings -> Publishing access ->
        # Trusted Publisher (repository Roarpeng/GraphFlow, workflow publish-npm.yml).
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL}" ]; then
            echo "::error::OIDC is unavailable - this job needs 'permissions: id-token: write'."
            exit 1
          fi
          echo "OIDC endpoint present; npm $(npm --version) will exchange the id-token for a publish credential."

      - name: Publish @roarpeng/graphflow (idempotent, OIDC + provenance)
        run: node scripts/publish-npm-idempotent.mjs
        env:
          HUSKY: "0"
