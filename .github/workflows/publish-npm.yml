name: Publish npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gate:release runs the Efficiency Agent golden gate, which resolves every corpus baseCommit.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Deliberately NO `registry-url` here. It makes setup-node write
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into .npmrc;
          # with no token secret that resolves to an EMPTY authToken, and npm
          # then prefers that credential over OIDC trusted publishing and issues
          # an unauthenticated PUT - which the registry reports as the
          # misleading "E404 ... PUT https://registry.npmjs.org/@scope%2fname".
          # The registry is set explicitly further down instead.

      - name: Enable package manager
        run: corepack enable

      - name: Install dependencies
        run: npm install --no-audit
        env:
          GRAPHFLOW_SKIP_POSTINSTALL: "1"
          HUSKY: "0"

      - name: Lint, build, and test
        run: npm run lint && npm run build && npm test

      - name: Generate release evidence (flywheel self-proof)
        run: npx tsx scripts/ci-release-evidence.ts
        env:
          # Explicit observable signal instead of inferring it from the workflow
          # name: the previous step runs lint + build + test and a non-zero exit
          # aborts the job, so reaching this line IS the test result.
          GRAPHFLOW_CI_TEST_RESULT: pass

      - name: Evidence and fidelity release gates
        run: npm run gate:release
        env:
          GRAPHFLOW_CONFIG_PATH: graphflow-out/ci.config.json

      - name: Verify npm authentication
        # whoami proves the token can read identity. It does NOT prove write:
        # a 2FA user token still fails publish with EOTP, and an unauthenticated
        # PUT is often reported as E404. OIDC Trusted Publishing does not need a token.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token != '' && secrets.npm_token || secrets.NPM_TOKEN }}
        run: |
          echo "npm $(npm --version)"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "GitHub OIDC is available (id-token: write). Publish will try Trusted Publishing first."
          fi
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "Authenticated as: $(npm whoami --registry=https://registry.npmjs.org)"
            echo "Note: whoami only proves identity; publish may still fail with EOTP if the token requires 2FA."
          elif [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No NODE_AUTH_TOKEN and no GitHub OIDC. Set the npm_token secret or configure npm Trusted Publishing."
            exit 1
          else
            echo "No NODE_AUTH_TOKEN; publish will use GitHub OIDC Trusted Publishing."
          fi

          # An explicit authToken (even an empty one left behind by a previous
          # setup-node `registry-url`) takes precedence over OIDC and produces a
          # bare unauthenticated PUT, so refuse to publish until it is gone.
          token_cfg="$(npm config get //registry.npmjs.org/:_authToken 2>/dev/null || true)"
          case "${token_cfg}" in
            ""|undefined|null|"null") ;; # no credential configured: OIDC will be used
            *)
              echo "::error::an authToken is configured for registry.npmjs.org; npm will use it and skip OIDC trusted publishing."
              exit 1
              ;;
          esac
          echo "no authToken configured - npm will exchange the GitHub id-token via OIDC."

      - name: Publish @roarpeng/graphflow (idempotent, OIDC + provenance)
        id: publish
        continue-on-error: true
        run: node scripts/publish-npm-idempotent.mjs
        env:
          HUSKY: "0"

      - name: npm OIDC diagnostics (always runs, so a failure is explainable)
        # npm reports every trusted-publishing misconfiguration as a bare 404 or
        # ENEEDAUTH, so dump what npm itself saw: which OIDC env vars exist, what
        # auth config resolved, and npm's own debug-log reasoning.
        # Values are NEVER printed - only presence and length.
        if: always()
        run: |
          echo "=== OIDC / auth environment (presence only) ==="
          echo "GITHUB_WORKFLOW='$GITHUB_WORKFLOW' (workflow name; Trusted Publisher wants filename publish-npm.yml)"
          echo "GITHUB_REPOSITORY='$GITHUB_REPOSITORY'"
          for v in GITHUB_ACTIONS GITHUB_WORKFLOW GITHUB_REPOSITORY GITHUB_REF \
                   ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN \
                   NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG_USERCONFIG; do
            val="${!v}"
            if [ -n "$val" ]; then echo "$v: present (length ${#val})"; else echo "$v: ABSENT"; fi
          done

          echo "=== resolved npm auth config ==="
          echo "registry: $(npm config get registry)"
          echo "userconfig: $(npm config get userconfig)"
          echo "_authToken for registry.npmjs.org: $(npm config get //registry.npmjs.org/:_authToken)"
          echo "--- effective .npmrc files (contents never printed) ---"
          for f in "$(npm config get userconfig)" "$(npm config get globalconfig)" ./.npmrc; do
            [ -f "$f" ] || continue
            if grep -q '_authToken' "$f" 2>/dev/null; then
              echo "[$f] exists and CONTAINS _authToken"
            else
              echo "[$f] exists, no _authToken"
            fi
          done

          echo "=== npm debug log: oidc / trusted / provenance / auth lines ==="
          for f in /home/runner/.npm/_logs/*-debug-0.log; do
            [ -f "$f" ] || continue
            echo "--- $f"
            grep -Ei 'oidc|trusted|provenance|auth|token' "$f" | tail -n 60 || true
          done

      - name: Fail when publish did not succeed
        if: steps.publish.outcome != 'success'
        run: |
          echo "::error::npm publish did not succeed (see the diagnostics above)."
          exit 1
