# GraphFlow — DeepSeek Harness (dsh) 插件层
#
# 用法:
#   dsh plugin --profile web add @roarpeng/graphflow
#   npx @deepseek-ai/dsh web
#   或已有 ~/.dsh 时: npx @roarpeng/graphflow install
#
# 能力:
#   1) MCP 10 工具挂到 ctx.tools（cwd = 会话/工作区 process.cwd()）。
#      模型侧名称: mcp__graphflow__graphflow_context / _plan / _run /
#      _report_outcome / _insight / _index / _skill_insights /
#      _diagnose / _artifact / _skill_guide
#   2) ESM glue `@roarpeng/graphflow/dsh`：ctx.skills.register(graphflow)
#      （dsh plugin add 即可用 skill，不必先 graphflow install）；
#      agent/disposed 时不默认把 pending episode 标成成功（等同 Claude Code
#      SessionEnd 空 $2 保持 pending）。显式 GRAPHFLOW_HOOK_SUCCESS=true|false
#      才调用 graphflow outcome report。不监听 live session/flush。
#   3) 首轮 agent/pre-step 注入一句短 hint：先调 graphflow_context（rootDir=cwd）。
#
# 调用约定: 先 context（传 rootDir），复杂任务再 plan；改完代码后 index；
#   若走了 run，结束后必须 report_outcome。不要写死 GRAPHFLOW_WORKSPACE_ROOT。
#
# graphflow install 也会把同一段 insert 写入 $DSH_HOME/cordis.patch.yml。

- insert:
    - id: mcp-graphflow
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: graphflow
        transport: stdio
        command: npx
        args:
          - '-y'
          - '--package=@roarpeng/graphflow'
          - graphflow-mcp
        env:
          GRAPHFLOW_MCP_STDIO: '1'
          GRAPHFLOW_LOG_JSON: '1'
        cwd: !!js process.cwd()
        failOnStartupError: false
    - id: graphflow-dsh
      name: '@roarpeng/graphflow/dsh'
